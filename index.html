<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>MetaLife</title>
  <link rel="stylesheet" href="css/style.css?v=20260910-loading-feedback">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/social.css?v=20260909-social">
<link rel="stylesheet" href="css/competitions.css?v=20260909-phase2">
<link rel="stylesheet" href="css/community.css?v=20260909-community">
</head>
<body>
<div id="toast"></div>
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand-mark">M</div>
    <h1>MetaLife</h1>
    <p>Planeje. Execute. Meça. Evolua.</p>
    <div class="tabs">
      <button class="tab active" data-auth-tab="login">Entrar</button>
      <button class="tab" data-auth-tab="register">Criar conta</button>
    </div>
    <form id="loginForm" class="auth-form">
      <input id="loginEmail" type="email" placeholder="E-mail" required autocomplete="email">
      <input id="loginPassword" type="password" placeholder="Senha" required autocomplete="current-password">
      <button class="primary">Entrar</button>
    </form>
    <form id="registerForm" class="auth-form hidden">
      <input id="regName" placeholder="Seu nome" required autocomplete="name">
      <input id="regEmail" type="email" placeholder="E-mail" required autocomplete="email">
      <input id="regPassword" type="password" minlength="6" placeholder="Senha (mín. 6 caracteres)" required autocomplete="new-password">
      <button class="primary">Criar conta</button>
    </form>
    <button id="demoBtn" class="secondary">Entrar em modo demonstração</button>
    <small>O modo demonstração salva os dados neste navegador.</small>
  </div>
</section>
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark small">M</div><span>MetaLife</span></div>
    <nav id="mainNav"></nav>
    <div class="sidebar-footer">
      <div id="userBadge" class="user-badge"></div>
      <button id="logoutBtn" class="nav-button danger">Sair</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="eyebrow">PAINEL PESSOAL</div><h1 id="pageTitle">Meu Dia</h1></div>
      <div class="top-actions"><span id="currentDate"></span><button id="quickAddBtn" class="icon-btn" title="Adicionar">＋</button></div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">Adicionar</h3><button id="modalClose" class="icon-btn">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js?v=20260910-loading-feedback"></script>
<script src="js/store.js"></script>
<script src="js/sync.js?v=20260909-xp-push"></script>
<script src="js/pwa.js?v=20260909-xp-push"></script>
<script src="js/app.js?v=20260910-loading-feedback"></script>
<script src="js/social.js?v=20260909-community"></script>
<script src="js/competitions.js?v=20260909-community"></script>
<script src="js/community.js?v=20260909-community"></script>
<script src="js/health-import.js?v=20260909-xp-push"></script>
<script src="js/progress.js?v=20260909-xp-push"></script>
</body>
</html>
